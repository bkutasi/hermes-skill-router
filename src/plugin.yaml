name: eagle-eye
version: 1.3.0
description: "5-layer intelligent skill matching — narrows 100+ skills to top-5 via hard triggers, BM25, synonym dictionary, dense embedding (HTTP API), and RRF fusion. Zero core modification."
author: "bkutasi"
license: "MIT"
homepage: "https://github.com/bkutasi/eagle-eye"
hooks:
  - pre_llm_call
dependencies:
  - jieba
  - numpy
  - requests
env:
  - name: HERMES_DISABLE_SKILL_RETRIEVAL
    description: Set to 1 to disable entirely
    default: ""
  - name: HERMES_SKILL_RETRIEVAL_TOP_K
    description: Number of skills to return
    default: "5"
  - name: HERMES_EMBEDDING_BASE_URL
    description: OpenAI-compatible embedding API base URL
    default: "http://localhost:8080/v1"
  - name: HERMES_EMBEDDING_MODEL
    description: Model name for embedding API
    default: "default"
  - name: HERMES_EMBEDDING_API_KEY
    description: API key for embedding endpoint (if required)
    default: ""
  - name: HERMES_EMBEDDING_BATCH_SIZE
    description: Batch size for HTTP embedding calls
    default: "16"
